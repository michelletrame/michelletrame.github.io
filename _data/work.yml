# One entry per case study, in homepage order.
# url: where the card links.
# cover: key in _data/images.yml (folder/name, no size suffix).
# cover_position: optional CSS object-position for the card crop (default: center).
# color: tile color on the homepage and accent on the case study (lemon, sky, blush, sage, plum, white).
# locked: shows a password note on the card.
# tags: type-of-work labels shown at the top of the case study.

